name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check leadforge tests

      - name: Test
        run: pytest -q --cov=leadforge --cov-report=term-missing

      - name: CLI smoke test
        shell: bash
        run: |
          leadforge --version
          leadforge doctor
          leadforge import sample_data/businesses_sample.csv
          leadforge score
          leadforge export json --out /tmp/leads.json
          leadforge list
