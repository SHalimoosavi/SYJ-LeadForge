name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev,backend]"

      - name: Lint
        run: ruff check leadforge backend tests

      - name: Test
        run: pytest -q --cov=leadforge --cov=backend --cov-report=term-missing

      - name: CLI smoke test
        shell: bash
        run: |
          leadforge --version
          leadforge doctor
          leadforge import sample_data/businesses_sample.csv
          leadforge score
          leadforge export json --out /tmp/leads.json
          leadforge list

      - name: CLI smoke test (forced legacy console encoding)
        # Regression guard for Windows cmd.exe / cp1252-style consoles:
        # forces a non-UTF-8 stdout encoding on every OS and asserts the
        # CLI still completes without UnicodeEncodeError.
        shell: bash
        env:
          PYTHONIOENCODING: cp1252
        run: |
          leadforge doctor
          leadforge score
          leadforge list

      - name: API smoke test (live uvicorn server)
        # Pure-Python script (no bash `&` backgrounding, no curl) so it
        # runs identically on Linux, macOS, and Windows runners: starts
        # a real server, drives it with real HTTP requests end-to-end.
        run: python scripts/api_smoke_test.py
