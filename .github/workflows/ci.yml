name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev,backend]"

      - name: Lint
        run: ruff check leadforge backend tests

      - name: Test
        run: pytest -q --cov=leadforge --cov=backend --cov-report=term-missing

      - name: CLI smoke test
        shell: bash
        run: |
          leadforge --version
          leadforge doctor
          leadforge plugins
          leadforge import sample_data/businesses_sample.csv
          leadforge score
          leadforge export json --out /tmp/leads.json
          leadforge list

      - name: CLI smoke test with an example plugin installed
        # Proves the plugin system actually works end-to-end, not just in
        # unit tests: installs a real example plugin into the plugin
        # directory `leadforge doctor` reports, then runs the normal
        # workflow and confirms the plugin shows up as loaded.
        shell: bash
        run: |
          PLUGIN_DIR=$(leadforge doctor | grep 'data dir' | awk '{print $3}')/plugins
          mkdir -p "$PLUGIN_DIR"
          cp plugins/examples/restaurant_pack.py "$PLUGIN_DIR/"
          leadforge plugins | grep -q restaurant_pack
          leadforge score
          leadforge list

      - name: CLI smoke test (forced legacy console encoding)
        # Regression guard for Windows cmd.exe / cp1252-style consoles:
        # forces a non-UTF-8 stdout encoding on every OS and asserts the
        # CLI still completes without UnicodeEncodeError.
        shell: bash
        env:
          PYTHONIOENCODING: cp1252
        run: |
          leadforge doctor
          leadforge score
          leadforge list

      - name: API smoke test (live uvicorn server)
        # Pure-Python script (no bash `&` backgrounding, no curl) so it
        # runs identically on Linux, macOS, and Windows runners: starts
        # a real server, drives it with real HTTP requests end-to-end.
        run: python scripts/api_smoke_test.py

  frontend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (static export)
        working-directory: frontend
        run: npm run build

      - name: Set up Python (for the live backend used below)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: pip install -e ".[dev,backend]"

      - name: Frontend <-> backend integration check
        # Starts a real backend, then runs the frontend's actual
        # lib/api.ts against it — proves the two sides of the contract
        # agree, not just that each half builds independently.
        shell: bash
        env:
          LEADFORGE_DELAY: "0"
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          cd frontend
          API_BASE=http://127.0.0.1:8000 npm run test:integration
          kill $SERVER_PID || true
